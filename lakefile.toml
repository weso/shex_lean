name = "shex_lean"
version = "0.1.0"
defaultTargets = ["shex_lean"]
testDriver = "shex_tests"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "ShexLean"

[[lean_lib]]
name = "Examples"
srcDir = "examples"
globs = [
  "Example", "Registry", "Proof", "ProofRegistry",
]

[[lean_exe]]
name = "shex_lean"
root = "Main"

# The test suite (refer to `tests/README.md`). It is separate from the
# formalization: `lake build` does not build it. `lake test` builds and runs it.
[[lean_lib]]
name = "ShexTests"
srcDir = "tests"

[[lean_exe]]
name = "shex_tests"
srcDir = "tests"
root = "ShexTestsMain"
